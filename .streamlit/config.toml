# .streamlit/config.toml
# ========================
# Streamlit theme for Retent Engram.
# The app injects its own CSS (frontend/components/theme.py) for full control
# over cards, tables, etc. — these are the base tokens native widgets read
# (sliders, checkboxes, the select dropdown highlight, code blocks, ...).
#
# RESTART REQUIRED after changing this file:
#   Ctrl+C -> streamlit run frontend/main.py

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F4F7FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F1F3D"
font = "sans serif"
baseRadius = "medium"

[server]
port = 8501
headless = false
gatherUsageStats = false

[browser]
serverAddress = "localhost"

[runner]
magicEnabled = true

[client]
toolbarMode = "minimal"
